name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch: # allow manual runs
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1f6feb&color_dots=#dbe9ff,#7db1ff,#3b82f6,#1f6feb,#0a3d91
            dist/github-snake-dark.svg?color_snake=#58a6ff&color_dots=#161b22,#0a3d91,#1155cc,#1f6feb,#58a6ff
            dist/github-contribution-grid-snake.gif?color_snake=#58a6ff&color_dots=#161b22,#0a3d91,#1155cc,#1f6feb,#58a6ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
